name: Build debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate content working files
        run: |
          python3 tools/selftest_extract.py
          python3 tools/build_l1_structure.py
          python3 tools/validate_level1.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: hanzi-journey-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK as downloadable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete debug-latest --yes --cleanup-tag || true
          gh release create debug-latest app/build/outputs/apk/debug/app-debug.apk \
            --prerelease --target "${{ github.sha }}" \
            --title "Debug APK (latest)" \
            --notes "Bản debug tự động build từ commit ${{ github.sha }}."
